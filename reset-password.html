<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ახალი პაროლის დაყენება</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f7f4;margin:0;padding:22px;color:#17351f}
.box{max-width:430px;margin:70px auto;background:white;padding:24px;border-radius:18px;box-shadow:0 8px 30px #0001}
h1{font-size:24px;margin:0 0 10px}
p{color:#58645b;line-height:1.45}
input{box-sizing:border-box;width:100%;padding:14px;margin:8px 0;border:1px solid #ccd5ce;border-radius:10px;font-size:16px}
button{width:100%;padding:14px;margin-top:10px;border:0;border-radius:10px;background:#16834a;color:#fff;font-size:16px;font-weight:700}
#msg{margin-top:14px;font-weight:700}
</style>
</head>
<body>
<div class="box">
<h1>ახალი პაროლის დაყენება</h1>
<p>შეიყვანე ახალი პაროლი ორჯერ.</p>
<input id="p1" type="password" placeholder="ახალი პაროლი" autocomplete="new-password">
<input id="p2" type="password" placeholder="გაიმეორე პაროლი" autocomplete="new-password">
<button id="save">პაროლის შენახვა</button>
<div id="msg"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://uqrcflysqlghnyequdll.supabase.co';
const SUPABASE_KEY='sb_publishable_sM_ngYbAZpTI0lMK_4pOtA_QhQgbLwe';
const client=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const msg=document.getElementById('msg');

async function establishSession(){
  const url=new URL(window.location.href);
  const code=url.searchParams.get('code');
  if(code){
    const {error}=await client.auth.exchangeCodeForSession(code);
    if(error) msg.textContent='ბმულის გახსნა ვერ მოხერხდა: '+error.message;
    return;
  }
  if(location.hash){
    const h=new URLSearchParams(location.hash.substring(1));
    const access_token=h.get('access_token');
    const refresh_token=h.get('refresh_token');
    if(access_token && refresh_token){
      const {error}=await client.auth.setSession({access_token,refresh_token});
      if(error) msg.textContent='ბმულის გახსნა ვერ მოხერხდა: '+error.message;
    }
  }
}
establishSession();

document.getElementById('save').onclick=async()=>{
  msg.textContent='';
  const p1=document.getElementById('p1').value;
  const p2=document.getElementById('p2').value;
  if(p1.length<8){msg.textContent='პაროლი უნდა იყოს მინიმუმ 8 სიმბოლო.';return}
  if(p1!==p2){msg.textContent='პაროლები ერთმანეთს არ ემთხვევა.';return}
  const {data:{session}}=await client.auth.getSession();
  if(!session){msg.textContent='აღდგენის ბმული არ არის აქტიური. ელფოსტიდან გახსენი ახალი პაროლის აღდგენის ბმული.';return}
  const {error}=await client.auth.updateUser({password:p1});
  if(error){msg.textContent='შეცდომა: '+error.message;return}
  msg.textContent='პაროლი წარმატებით შეიცვალა. ახლა შეგიძლია ადმინ-პანელში შესვლა.';
  setTimeout(()=>location.href='/admin.html',1800);
};
</script>
</body>
</html>
