<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>კატალოგის მართვა</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f5f7f3;margin:0;color:#183d28}
.w{max-width:900px;margin:auto;padding:14px}
h1{font-size:27px}
input,textarea,button{
 width:100%;padding:12px;margin:6px 0;
 border:1px solid #ccd5ca;border-radius:10px;font-size:15px
}
textarea{min-height:80px}
button{background:#277943;color:#fff;font-weight:700;border:0}
.secondary{background:#e9f3ec;color:#176438}
.danger{background:#a83232}
.box{background:#fff;padding:14px;border-radius:15px;margin:12px 0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.check{width:auto}
#msg{margin-top:8px;font-weight:700}
@media(max-width:550px){.row{grid-template-columns:1fr}}
</style>
</head>

<body>
<main class="w">

<h1>კატალოგის მართვა</h1>

<div id="auth" class="box">
<input id="email" type="email"
