<!doctype html><html lang="ka"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ადმინ პანელი</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:system-ui;background:#f5f7f3;color:#18351f;margin:0}.w{max-width:900px;margin:auto;padding:18px}.c{background:white;padding:14px;margin:10px 0;border-radius:16px}.g{display:grid;grid-template-columns:1.4fr repeat(3,1fr);gap:8px}input,button{padding:10px;border-radius:9px;border:1px solid #ccd5ca;box-sizing:border-box}button{background:#276b3a;color:white;border:0;font-weight:700}.hide{display:none}@media(max-width:650px){.g{grid-template-columns:1fr 1fr}.name{grid-column:1/-1}}</style></head><body><div class="w"><div id="login" class="c"><h2>ადმინ პანელი</h2><input id="email" type="email" placeholder="ელფოსტა"><input id="password" type="password" placeholder="პაროლი"><button onclick="signin()">შესვლა</button><p id="msg"></p></div><div id="app" class="hide"><h2>პროდუქტების მართვა</h2><div id="list"></div><button onclick="out()">გასვლა</button></div></div><script>
const sb=supabase.createClient('https://uqrcflysqlghnyequdll.supabase.co','sb_publishable_sM_ngYbAZpTI0lMK_4pOtA_QhQgbLwe');
async function signin(){let {error}=await sb.auth.signInWithPassword({email:email.value,password:password.value});if(error){msg.textContent=error.message;return}boot()}
async function out(){await sb.auth.signOut();location.reload()}
async function boot(){let {data:{user}}=await sb.auth.getUser();if(!user)return;let {data:p}=await sb.from('profiles').select('role').eq('id',user.id).maybeSingle();if(!p||p.role!=='owner'){msg.textContent='ადმინისტრატორის უფლება არ არის';await sb.auth.signOut();return}login.classList.add('hide');app.classList.remove('hide');load()}
async function load(){let {data,error}=await sb.from('products').select('id,name,sale_price,old_price,promo_price,promo_active,in_stock').order('name');if(error){list.textContent=error.message;return}list.innerHTML='';data.forEach(x=>{let d=document.createElement('div');d.className='c';d.innerHTML=`<div class="g"><b class="name">${x.name}</b><label>ფასი<input data-k="sale_price" type="number" value="${x.sale_price??''}"></label><label>ძველი ფასი<input data-k="old_price" type="number" value="${x.old_price??''}"></label><label>აქციის ფასი<input data-k="promo_price" type="number" value="${x.promo_price??''}"></label><label><input data-k="promo_active" type="checkbox" ${x.promo_active?'checked':''}> აქცია</label><label><input data-k="in_stock" type="checkbox" ${x.in_stock?'checked':''}> მარაგშია</label><button>შენახვა</button><span></span></div>`;d.querySelector('button').onclick=()=>save(x.id,d);list.appendChild(d)})}
async function save(id,d){let v={};d.querySelectorAll('[data-k]').forEach(e=>v[e.dataset.k]=e.type==='checkbox'?e.checked:(e.value===''?null:Number(e.value)));let s=d.querySelector('span');s.textContent='ინახება…';let {error}=await sb.from('products').update(v).eq('id',id);s.textContent=error?'შეცდომა':'შენახულია ✓'}
boot();</script></body></html>
