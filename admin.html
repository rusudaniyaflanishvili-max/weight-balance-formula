<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>კატალოგის მართვა</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial;background:#f5f7f3;color:#183d28;margin:0}
main{max-width:700px;margin:auto;padding:15px}
.box{background:white;padding:15px;margin:12px 0;border-radius:14px}
input,button{box-sizing:border-box;width:100%;padding:12px;margin:6px 0}
button{background:#277943;color:white;border:0;border-radius:9px;font-weight:bold}
</style>
</head>
<body>
<main>
<h2>კატალოგის მართვა</h2>

<div id="login" class="box">
<input id="email" value="poladishviligogita@gmail.com">
<input id="pass" type="password" placeholder="პაროლი">
<button onclick="enter()">შესვლა</button>
<button onclick="reset()">პაროლი დამავიწყდა</button>
<p id="msg"></p>
</div>

<div id="panel" hidden>
<h3>პროდუქტები</h3>
<div id="products"></div>
</div>
</main>

<script>
const s=supabase.createClient(
'https://uqrcflysqlghnyequdll.supabase.co',
'sb_publishable_sM_ngYbAZpTI0lMK_4pOtA_QhQgbLwe'
);

async function enter(){
 let {error}=await s.auth.signInWithPassword({
 email:email.value,
 password:pass.value
 });
 if(error){msg.innerText=error.message;return}
 openPanel();
}

async function reset(){
 let {error}=await s.auth.resetPasswordForEmail(
 email.value,
 {redirectTo:'https://ruska-catalog-ready.vercel.app/reset-password.html'}
 );
 msg.innerText=error?error.message:'აღდგენის წერილი გამოგზავნილია';
}

async function openPanel(){
 let {data,error}=await s.from('products')
 .select('id,name,sale_price')
 .order('name');

 if(error){msg.innerText=error.message;return}

 login.hidden=true;
 panel.hidden=false;
