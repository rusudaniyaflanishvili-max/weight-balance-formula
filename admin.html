
<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>კატალოგის მართვა</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
 font-family:Arial,sans-serif;
 background:#f5f7f3;
 margin:0;
 color:#183d28
}
.w{max-width:900px;margin:auto;padding:14px}
h1{font-size:27px}
input,textarea,button{
 width:100%;
 padding:12px;
 margin:6px 0;
 border:1px solid #ccd5ca;
 border-radius:10px;
 font-size:15px
}
textarea{min-height:85px}
button{
 background:#277943;
 color:white;
 font-weight:700;
 border:0
}
.secondary{background:#e9f3ec;color:#176438}
.danger{background:#a83232}
.box{
 background:white;
 padding:14px;
 border-radius:15px;
 margin:12px 0
}
.row{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:8px
}
.check{width:auto}
.thumb{
 width:150px;
 height:110px;
 object-fit:contain
}
#msg{
 margin-top:8px;
 font-weight:700;
 font-size:14px
}
@media(max-width:550px){
 .row{grid-template-columns:1fr}
}
</style>
</head>

<body>

<main class="w">

<h1>კატალოგის მართვა</h1>

<div id="auth" class="box">

<input
 id="email"
 type="email"
 value="poladishviligogita@gmail.com"
 placeholder="ელფოსტა"
>

<input
 id="pass"
 type="password"
 placeholder="პაროლი"
>

<button onclick="login()">შესვლა</button>

<button
 class="secondary"
 onclick="forgotPassword()"
>
პაროლი დამავიწყდა
</button>

<div id="msg"></div>

</div>


<div id="app" hidden>

<div class="box">

<h2>კურიერის ფასი</h2>

<div class="row">
<input id="tb" type="number" placeholder="თბილისი">
<input id="ru" type="number" placeholder="რუსთავი">
<input id="re" type="number" placeholder="სხვა ქალაქები">
<input id="vi" type="number" placeholder="სოფლები">
</div>

<label>
<input class="check" id="free" type="checkbox">
უფასო კურიერი
</label>

<button onclick="saveDelivery()">შენახვა</button>

</div>


<div class="box">

<h2>ახალი პროდუქტი</h2>

<input id="nn" placeholder="დასახელება">
<input id="nb" placeholder="ბრენდი">
<input id="nc" placeholder="კატეგორია">
<input id="np" type="number" placeholder="ფასი">

<textarea id="nd" placeholder="აღწერა"></textarea>

<label>ფოტო</label>

<input
 id="nf"
 type="file"
 accept="image/jpeg,image/png,image/webp"
>

<input id="ni" placeholder="ან ფოტოს URL">

<button onclick="addProduct()">
პროდუქტის დამატება
</button>

</div>


<h2>პროდუქტები</h2>

<div id="list"></div>

<button onclick="logout()">გასვლა</button>

</div>

</main>


<script>

const sb=supabase.createClient(
 'https://uqrcflysqlghnyequdll.supabase.co',
 'sb_publishable_sM_ngYbAZpTI0lMK_4pOtA_QhQgbLwe'
);


async function login(){

 msg.textContent='';

 const {error}=await sb.auth.signInWithPassword({
  email:email.value.trim(),
  password:pass.value
 });

 if(error){
  msg.textContent='შესვლა ვერ მოხერხდა: '+error.message;
  return;
 }

 start();
}


async function forgotPassword(){

 msg.textContent='იგზავნება...';

 const mail=email.value.trim();

 if(!mail){
  msg.textContent='ჩაწერე ელფოსტა.';
  return;
 }

 const {error}=await sb.auth.resetPasswordForEmail(
  mail,
  {
   redirectTo:
   'https://ruska-catalog-ready.vercel.app/reset-password.html'
  }
 );

 if(error){
  msg.textContent='შეცდომა: '+error.message;
  return;
 }

 msg.textContent=
 'პაროლის აღდგენის წერილი გამოგზავნილია. შეამოწმე ელფოსტა.';
}


async function logout(){

 await sb.auth.signOut();

 location.reload();

}


async function start(){

 const {data:{user}}=
 await sb.auth.getUser();

 if(!user)return;

 const {data:p}=await sb
 .from('profiles')
 .select('role')
 .eq('id',user.id)
 .single();

 if(p?.role!=='owner'){

  msg.textContent=
  'ადმინისტრატორის უფლება არ არის.';

  return;
 }

 auth.hidden=true;
 app.hidden=false;

 await loadDelivery();
 await loadProducts();

}


async function loadDelivery(){

 const {data}=await sb
 .from('site_settings')
 .select('value')
 .eq('key','delivery')
 .single();

 const v=data?.value||{};

 tb.value=v.tbilisi??6;
 ru.value=v.rustavi??7;
 re.value=v.region??8;
 vi.value=v.village??10;

 free.checked=!!v.free_delivery;

}


async function saveDelivery(){

 const {error}=await sb.rpc(
  'admin_set_delivery',
  {
   p_tbilisi:+tb.value,
   p_rustavi:+ru.value,
   p_region:+re.value,
   p_village:+vi.value,
   p_free:free.checked
  }
 );

 alert(
  error
  ? 'ვერ შეინახა: '+error.message
  : 'შენახულია'
 );

}


async function uploadPhoto(file){

 const ext=
 file.name.split('.').pop()||'jpg';

 const path=
 'products/'+Date.now()+'.'+ext;

 const {error}=await sb.storage
 .from('product-images')
 .upload(path,file);

 if(error)throw error;

 return sb.storage
 .from('product-images')
 .getPublicUrl(path)
 .data.publicUrl;

}


async function addProduct(){

 if(!nn.value.trim()){

  alert('ჩაწერე პროდუქტის სახელი');

  return;

 }

 let img=ni.value.trim()||null;

 try{

  if(nf.files[0]){

   img=await uploadPhoto(
    nf.files[0]
   );

  }

 }catch(e){

  alert(
   'ფოტო ვერ აიტვირთა: '
   +e.message
  );

  return;

 }


 const {error}=await sb.rpc(
  'admin_add_product',
  {
   p_name:nn.value.trim(),
   p_brand:nb.value||null,
   p_category:nc.value||null,
   p_price:+np.value||0,
   p_description:nd.value||null,
   p_image_url:img
  }
 );

 if(error){

  alert(
   'ვერ დაემატა: '
   +error.message
  );

  return;

 }

 nn.value='';
 nb.value='';
 nc.value='';
 np.value='';
 nd.value='';
 ni.value='';
 nf.value='';

 await loadProducts();

 alert('პროდუქტი დაემატა');

}


async function loadProducts(){

 const {data,error}=await sb
 .from('products')
 .select(
  'id,name,sale_price,old_price,promo_price,promo_active,in_stock,active'
 )
 .order('name');

 if(error){

  alert(error.message);

  return;

 }

 list.innerHTML=
 (data||[]).map(p=>`

 <div
  class="box product"
  data-id="${p.id}"
 >

 <b>${p.name}</b>

 <input
  class="sale"
  type="number"
  placeholder="ფასი"
  value="${p.sale_price??0}"
 >

 <input
  class="old"
  type="number"
  placeholder="ძველი ფასი"
  value="${p.old_price??''}"
 >

 <input
  class="promo"
  type="number"
  placeholder="აქციის ფასი"
  value="${p.promo_price??''}"
 >

 <label>
 <input
  class="check pa"
  type="checkbox"
  ${p.promo_active?'checked':''}
 >
 აქცია ჩართულია
 </label>

 <br>

 <label>
 <input
  class="check stock"
  type="checkbox"
  ${p.in_stock?'checked':''}
 >
 მარაგშია
 </label>

 <br>

 <label>
 <input
  class="check active"
  type="checkbox"
  ${p.active?'checked':''}
 >
 საიტზე ჩანს
 </label>

 <button onclick="saveProduct(this)">
 შენახვა
 </button>

 <button
  class="danger"
  onclick="deleteProduct(this)"
 >
 წაშლა
 </button>

 </div>

 `).join('');

}


async function saveProduct(btn){

 const b=
 btn.closest('.product');

 const val=x=>{

  const v=
  b.querySelector(x).value;

  return v===''?null:+v;

 };


 const {error}=await sb.rpc(
  'admin_update_product',
  {
   p_id:b.dataset.id,
   p_name:b.querySelector('b').textContent,
   p_brand:null,
   p_category:null,
   p_price:val('.sale'),
   p_description:null,
   p_image_url:null,
   p_old_price:val('.old'),
   p_promo_price:val('.promo'),
   p_promo_active:
    b.querySelector('.pa').checked,
   p_in_stock:
    b.querySelector('.stock').checked,
   p_active:
    b.querySelector('.active').checked
  }
 );

 alert(
  error
  ? 'ვერ შეინახა: '+error.message
  : 'შენახულია'
 );

}


async function deleteProduct(btn){

 const b=
 btn.closest('.product');

 if(!confirm(
  'ნამდვილად წავშალოთ?'
 ))return;


 const {error}=await sb.rpc(
  'admin_delete_product',
  {
   p_id:b.dataset.id
  }
 );

 if(error){

  alert(
   'ვერ წაიშალა: '
   +error.message
  );

  return;

 }

 await loadProducts();

}


start();

</script>

</body>
</html>
