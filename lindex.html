<!doctype html><html lang="ka"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ადმინი</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial;background:#f5f7f3;margin:0;color:#183d28}.w{max-width:900px;margin:auto;padding:16px}input,select,textarea,button{width:100%;padding:10px;margin:5px 0;border:1px solid #ccd5ca;border-radius:9px}button{background:#277943;color:white;font-weight:700}.box{background:white;padding:14px;border-radius:15px;margin:12px 0}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.check{width:auto}small{color:#68736b}@media(max-width:550px){.row{grid-template-columns:1fr}}</style></head><body><main class="w"><h1>კატალოგის მართვა</h1><div id="auth" class="box"><input id="email" placeholder="ელფოსტა"><input id="pass" type="password" placeholder="პაროლი"><button onclick="login()">შესვლა</button></div><div id="app" hidden><div class="box"><h2>კურიერის ფასი</h2><div class="row"><input id="tb" type="number" placeholder="თბილისი"><input id="ru" type="number" placeholder="რუსთავი"><input id="re" type="number" placeholder="სხვა ქალაქები"><input id="vi" type="number" placeholder="სოფლები"></div><label><input class="check" id="free" type="checkbox"> უფასო კურიერი</label><button onclick="saveDelivery()">შენახვა</button></div><div class="box"><h2>ახალი პროდუქტი</h2><input id="nn" placeholder="დასახელება"><div class="row"><input id="nb" placeholder="ბრენდი"><input id="nc" placeholder="კატეგორია"></div><input id="np" type="number" placeholder="ფასი"><textarea id="nd" placeholder="აღწერა"></textarea><input id="ni" placeholder="ფოტოს URL (თუ გაქვს)"><button onclick="addProduct()">პროდუქტის დამატება</button></div><h2>პროდუქტების მართვა</h2><div id="list"></div><button onclick="logout()">გასვლა</button></div></main><script>
const sb=supabase.createClient('https://uqrcflysqlghnyequdll.supabase.co','sb_publishable_sM_ngYbAZpTI0lMK_4pOtA_QhQgbLwe');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function login(){const {error}=await sb.auth.signInWithPassword({email:email.value,password:pass.value});if(error)return alert('შესვლა ვერ მოხერხდა');start()}
async function logout(){await sb.auth.signOut();location.reload()}
async function start(){const {data:{user}}=await sb.auth.getUser();if(!user)return;const {data:p}=await sb.from('profiles').select('role').eq('id',user.id).single();if(p?.role!=='owner')return alert('ადმინისტრატორის უფლება არ არის');auth.hidden=true;app.hidden=false;await loadDelivery();await loadProducts()}
async function loadDelivery(){const {data}=await sb.from('site_settings').select('value').eq('key','delivery').single();const v=data?.value||{};tb.value=v.tbilisi??6;ru.value=v.rustavi??7;re.value=v.region??8;vi.value=v.village??10;free.checked=!!v.free_delivery}
async function saveDelivery(){const {error}=await sb.rpc('admin_set_delivery',{p_tbilisi:+tb.value,p_rustavi:+ru.value,p_region:+re.value,p_village:+vi.value,p_free:free.checked});alert(error?'ვერ შეინახა':'შენახულია')}
async function addProduct(){if(!nn.value.trim())return alert('ჩაწერე პროდუქტის სახელი');const {error}=await sb.rpc('admin_add_product',{p_name:nn.value,p_brand:nb.value||null,p_category:nc.value||null,p_price:+np.value||0,p_description:nd.value||null,p_image_url:ni.value||null});if(error)return alert('ვერ დაემატა: '+error.message);nn.value=nb.value=nc.value=np.value=nd.value=ni.value='';await loadProducts();alert('პროდუქტი დაემატა')}
async function loadProducts(){const {data,error}=await sb.from('products').select('id,name,sale_price,old_price,promo_price,promo_active,in_stock').order('name');if(error)return alert(error.message);list.innerHTML=(data||[]).map(p=>'<div class="box" data-id="'+p.id+'"><b>'+esc(p.name)+'</b><small>ფასი</small><input class="sale" type="number" value="'+(p.sale_price??0)+'"><small>ძველი ფასი</small><input class="old" type="number" value="'+(p.old_price??'')+'"><small>აქციის ფასი</small><input class="promo" type="number" value="'+(p.promo_price??'')+'"><label><input class="check pa" type="checkbox" '+(p.promo_active?'checked':'')+'> აქცია ჩართულია</label><label><input class="check stock" type="checkbox" '+(p.in_stock?'checked':'')+'> მარაგშია</label><button onclick="saveProduct(this)">შენახვა</button></div>').join('')}
async function saveProduct(btn){const b=btn.closest('.box');const val=x=>{const v=b.querySelector(x).value;return v===''?null:+v};const {error}=await sb.from('products').update({sale_price:val('.sale'),old_price:val('.old'),promo_price:val('.promo'),promo_active:b.querySelector('.pa').checked,in_stock:b.querySelector('.stock').checked}).eq('id',b.dataset.id);alert(error?'ვერ შეინახა':'შენახულია')}
start();
</script></body></html>
